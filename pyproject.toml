[project]
name = "deepeval-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mistyrain520", email = "1298616974@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.16.1",
    "langfuse>=5.0.2",
    "openai>=1.60.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.0.0",
    "pywin32>=312",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
deepeval = [
    "deepeval>=4.2.8",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
deepeval-demo = "deepeval_demo:main"
deepeval-eval = "deepeval_demo.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
